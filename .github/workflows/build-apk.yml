name: Build Winlator Mali APK

on:
  push:
    branches: [ main, bionic-mali-1.0, '**' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, bionic-mali-1.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;35.0.0" "platforms;android-34"

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Standard Release APK
        run: ./gradlew assembleStandardRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinlatorMali-Standard-Release
          path: app/build/outputs/apk/standard/release/*.apk
          retention-days: 14
